<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="defaultGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#defaultGradient)" />
  
  <!-- Building icon -->
  <g transform="translate(50, 50)">
    <!-- Building shape -->
    <rect x="-20" y="-15" width="40" height="30" fill="none" stroke="white" stroke-width="2" rx="2"/>
    
    <!-- Windows -->
    <rect x="-16" y="-10" width="6" height="6" fill="white" opacity="0.8"/>
    <rect x="-4" y="-10" width="6" height="6" fill="white" opacity="0.8"/>
    <rect x="8" y="-10" width="6" height="6" fill="white" opacity="0.8"/>
    
    <rect x="-16" y="2" width="6" height="6" fill="white" opacity="0.8"/>
    <rect x="-4" y="2" width="6" height="6" fill="white" opacity="0.8"/>
    <rect x="8" y="2" width="6" height="6" fill="white" opacity="0.8"/>
    
    <!-- Door -->
    <rect x="-6" y="8" width="4" height="8" fill="white" opacity="0.6"/>
    <circle cx="-2" cy="12" r="1" fill="white" opacity="0.4"/>
    
    <!-- Flag pole -->
    <line x1="20" y1="-15" x2="20" y2="-25" stroke="white" stroke-width="1.5"/>
    <!-- Flag -->
    <polygon points="20,-25 20,-20 26,-22" fill="white" opacity="0.9"/>
  </g>
</svg>